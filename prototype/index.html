<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ReForm Batch Passport</title><style>:root{--bg:#071d17;--p:#102b22;--p2:#17382c;--ink:#f3f4e8;--m:#aab8a9;--g:#c9f36a;--l:#315344;--a:#f3c969}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 10%,#173b2c,#071d17 50%);color:var(--ink);font:15px/1.5 Arial}.wrap{max-width:1100px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;border-bottom:1px solid var(--l);padding-bottom:18px}.brand{font-size:24px;font-weight:bold}.brand b{color:var(--g)}.tag{border:1px solid var(--g);color:var(--g);padding:6px 12px;border-radius:25px;font-size:11px}h1{font-size:34px;margin:30px 0 4px}.muted{color:var(--m)}.layout{display:grid;grid-template-columns:220px 1fr;gap:20px;margin-top:24px}.nav,.panel{background:var(--p);border:1px solid var(--l);border-radius:16px;padding:18px}.nav button{display:block;width:100%;text-align:left;padding:13px;margin:5px 0;border:1px solid transparent;border-radius:9px;background:transparent;color:var(--m);cursor:pointer}.nav button.active{background:var(--p2);color:var(--g);border-color:var(--l)}.ey{color:var(--g);font-size:11px;letter-spacing:1.5px;font-weight:bold}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}.field{background:#0a211a;border:1px solid var(--l);padding:15px;border-radius:10px}.field small{display:block;color:var(--m);font-size:10px;margin-bottom:6px}.notice{background:#302b1c;border:1px solid #78653a;color:var(--a);padding:14px;border-radius:10px;margin-top:18px}.actions{display:flex;justify-content:space-between;margin-top:22px}.actions button{padding:12px 18px;border:0;border-radius:9px;background:var(--g);font-weight:bold;cursor:pointer}.actions .back{background:transparent;color:var(--ink);border:1px solid var(--l)}table{width:100%;border-collapse:collapse;margin-top:20px}td{padding:12px;border-bottom:1px solid var(--l)}td:first-child{color:var(--m)}@media(max-width:700px){.layout{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}</style><div class="wrap"><header class="top"><div class="brand"><b>◉</b> ReForm <small class="muted"> / WASTE, REBORN</small></div><div class="tag">CONCEPT · SAMPLE DATA</div></header><h1>Material batch workspace</h1><div class="muted">A transparent record from selected feedstock to a qualified next use.</div><div class="layout"><nav class="nav" id="nav"></nav><main class="panel" id="view"></main></div><p class="muted" style="font-size:11px">Human review remains mandatory · Not a certified material record · No backend or AI model is implemented.</p></div><script>const S=[{n:"Intake",e:"STEP 01 / INTAKE & IDENTITY",t:"Register a known-source PLA batch",d:"Sample record RF-001 · illustrative values only",f:[["POLYMER","PLA · source documented"],["ORIGIN","Campus print supports & failed parts"],["GROSS INPUT","1.20 kg · sample value"],["CONTAMINATION","Manual inspection required"]],note:"No automated material identification is claimed. Unknown or mixed plastics are held for verification."},{n:"Preparation",e:"STEP 02 / PREPARATION",t:"Record the controlled process",d:"Track what happened before extrusion.",f:[["PREPARATION","Sorting · cleaning · drying"],["FORMULATION","Recycled fraction: pending"],["PROCESS SETTINGS","Operator-recorded parameters"],["PROCESS STATUS","Not yet performed"]],note:"No temperatures or additives are prescribed. A qualified lab must approve the protocol."},{n:"Quality review",e:"STEP 03 / QUALITY REVIEW",t:"Check evidence before release",d:"A batch is not approved simply because it was recycled.",f:[["FILAMENT DIAMETER","Not measured"],["PRINT RELIABILITY","Not tested"],["APPLICATION TEST","Not tested"],["RELEASE STATUS","NOT RELEASED"]],note:"No lab measurements entered. AI quality prediction is not implemented in this concept demo."},{n:"Batch passport",e:"STEP 04 / BATCH PASSPORT",t:"A traceable record for the next use",d:"One batch ID connects source, process, tests and destination.",f:[["BATCH ID","RF-001"],["MATERIAL","Known-source PLA"],["SOURCE & INPUT","Illustrative sample record"],["PROCESSING","Pending"],["QUALITY CHECKS","Not tested"],["NEXT DESTINATION","Not assigned"]],note:"RELEASE DECISION: HOLD. Human review is required before use."}];let c=0;function go(n){c=n;render()}function render(){nav.innerHTML=S.map((s,i)=>'<button class="'+(i===c?'active':'')+'" onclick="go('+i+')">'+String(i+1).padStart(2,'0')+' · '+s.n+'</button>').join('');let s=S[c],fields=s.f.map(f=>'<div class="field"><small>'+f[0]+'</small><b>'+f[1]+'</b></div>').join('');view.innerHTML='<div class="ey">'+s.e+'</div><h2>'+s.t+'</h2><p class="muted">'+s.d+'</p>'+(c===3?'<table>'+s.f.map(f=>'<tr><td>'+f[0]+'</td><td>'+f[1]+'</td></tr>').join('')+'</table>':'<div class="grid">'+fields+'</div>')+'<div class="notice">'+s.note+'</div><div class="actions"><button class="back" onclick="go('+Math.max(0,c-1)+')">← Back</button><button onclick="go('+(c===3?0:c+1)+')">'+(c===3?'Restart ↻':'Continue →')+'</button></div>'}render();</script></html>
