<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">ReForm — Waste, reborn</title><desc id="desc">AI for Climate circular economy project cover. Selected PLA waste becomes engineered filament and useful products.</desc>
<defs>
 <radialGradient id="bg" cx="72%" cy="42%" r="80%"><stop offset="0" stop-color="#103c2c"/><stop offset="1" stop-color="#061e17"/></radialGradient>
 <linearGradient id="filament" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e4ff8b"/><stop offset=".45" stop-color="#b9ec55"/><stop offset="1" stop-color="#74b52c"/></linearGradient>
 <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#456f5e"/><stop offset=".5" stop-color="#183e30"/><stop offset="1" stop-color="#0a261e"/></linearGradient>
 <linearGradient id="spoolside" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#345c4c"/><stop offset=".5" stop-color="#173b2e"/><stop offset="1" stop-color="#09251d"/></linearGradient>
 <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="24"/></filter>
 <pattern id="coil" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 1 H8" stroke="#e2ff9a" stroke-opacity=".45" stroke-width="1.6"/></pattern>
</defs>
